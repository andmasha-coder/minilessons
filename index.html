<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Practice — Activities</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FF;
    --ink:#213353;
    --ink-soft:#5B6B8C;
    --sun:#FFC93C;
    --sun-deep:#F2A93C;
    --coral:#FF7A63;
    --card:#FFFFFF;
    --ring:#B8CBE0;
    --shadow: 0 10px 24px rgba(33,51,83,0.10);
    --shadow-lg: 0 16px 34px rgba(33,51,83,0.16);
    font-family: 'Nunito', sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 10% -10%, #FFF6DE 0%, transparent 55%),
      radial-gradient(1000px 500px at 110% 10%, #E4F4FF 0%, transparent 50%),
      var(--sky);
    color:var(--ink);
    min-height:100vh;
    padding:40px 16px 60px;
  }
  .wrap{max-width:840px;margin:0 auto;text-align:center;}
  .kicker{
    font-family:'Baloo 2',sans-serif;
    display:inline-flex;align-items:center;gap:8px;
    background:var(--card);
    padding:6px 16px;border-radius:999px;
    box-shadow:var(--shadow);
    font-weight:700;font-size:0.85rem;color:var(--ink-soft);
    margin-bottom:12px;
  }
  h1{
    font-family:'Baloo 2',sans-serif;
    font-size:clamp(1.9rem, 4.5vw, 2.7rem);
    margin:6px 0 8px;
  }
  h1 span{color:var(--coral);}
  .sub{color:var(--ink-soft);font-size:1.05rem;margin:0 auto 34px;max-width:480px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:20px;
    text-align:left;
  }
  .card{
    background:var(--card);
    border-radius:22px;
    box-shadow:var(--shadow-lg);
    padding:30px 22px 26px;
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
    text-align:center;
    transition:transform .18s ease, box-shadow .18s ease;
  }
  .card:hover{transform:translateY(-4px);}
  .card .icon{
    width:96px;height:96px;border-radius:24px;
    display:flex;align-items:center;justify-content:center;
    font-size:3.4rem;
    background:linear-gradient(160deg, var(--c1), var(--c2));
    box-shadow:0 8px 18px rgba(33,51,83,0.18);
    margin:0 auto 6px;
  }
  .card h2{
    font-family:'Baloo 2',sans-serif;
    font-size:1.55rem;margin:0;text-align:center;
  }
  .card .go{
    margin-top:8px;
    font-family:'Baloo 2',sans-serif;font-weight:700;font-size:0.9rem;
    color:var(--coral);
    display:inline-flex;align-items:center;gap:6px;
  }
  .card.coming-soon{
    opacity:0.55;
    pointer-events:none;
  }
  .card.coming-soon .go{color:var(--ink-soft);}

  footer{text-align:center;color:var(--ink-soft);font-size:0.8rem;margin-top:40px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">🗓️ English A1 · Practice activities</div>
  <h1>Choose <span>your activity</span></h1>

  <div class="grid">
    <a class="card" href="months-practice.html">
      <div class="icon" style="--c1:#CFE9FF; --c2:#4E8FD9;">🗓️</div>
      <h2>Months of the Year</h2>
      <span class="go">Start →</span>
    </a>

    <a class="card" href="feelings-practice.html">
      <div class="icon" style="--c1:#FFD3E4; --c2:#E8598E;">🙂</div>
      <h2>Feelings</h2>
      <span class="go">Start →</span>
    </a>

    <!-- To add a new activity later, copy one of the <a class="card"> blocks above,
         change the icon, colours, title, description, and the href to your new file name. -->
  </div>

  <footer>Made for practising English · A1 level</footer>
</div>
</body>
</html>
