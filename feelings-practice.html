    color: var(--ink);
    padding: 24px 16px 48px;
    min-height: 100vh;
  }
  .wrap{ max-width: 640px; margin: 0 auto; }
  header{ text-align:center; margin-bottom: 18px; }
  h1{
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    margin: 0 0 6px;
    color: var(--plum-dark);
    font-weight: 700;
  }
  header p{
    margin: 0;
    color: var(--ink);
    opacity: 0.75;
    font-size: 0.98rem;
  }
  .stats{
    display:flex;
    justify-content:center;
    gap: 14px;
    margin: 16px 0 26px;
    flex-wrap: wrap;
  }
  .stat{
    background: var(--paper);
    border: 2px solid var(--plum);
    border-radius: 14px;
    padding: 8px 18px;
    font-weight: 600;
    color: var(--plum-dark);
    min-width: 92px;
    text-align:center;
  }
  .stat span{ display:block; font-size: 1.3rem; font-weight:700; }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap: 18px;
  }

  .speaker-btn{
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--plum);
    border: none;
    cursor: pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow: 0 5px 0 var(--plum-dark);
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  .speaker-btn:hover{ background: #7C5CA3; }
  .speaker-btn:active{ transform: translateY(3px); box-shadow: 0 2px 0 var(--plum-dark); }
  .speaker-btn svg{ width: 42px; height: 42px; fill: white; }
  .speaker-btn.playing{ animation: pulse 0.7s ease infinite; }
  @keyframes pulse{
    0%, 100% { box-shadow: 0 5px 0 var(--plum-dark), 0 0 0 0 rgba(107,78,142,0.4); }
    50% { box-shadow: 0 5px 0 var(--plum-dark), 0 0 0 12px rgba(107,78,142,0); }
  }
  .replay-hint{
    font-size: 0.85rem;
    color: var(--plum-dark);
    opacity: 0.65;
    margin-top: -8px;
  }

  .choices{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
    width: 100%;
    margin-top: 6px;
  }
  @media (max-width: 480px){
    .choices{ grid-template-columns: 1fr; max-width: 260px; margin-left:auto; margin-right:auto; }
  }
  .choice{
    background: var(--paper);
    border: 3px solid var(--plum);
    border-radius: 16px;
    overflow: hidden;
    cursor: pointer;
    aspect-ratio: 3/4;
    position: relative;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .choice:hover{ transform: translateY(-3px); }
  .choice img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    display:block;
  }
  .choice.correct{
    border-color: var(--green);
    box-shadow: 0 0 0 4px rgba(63,148,99,0.35);
  }
  .choice.correct::after{
    content: "✓";
    position: absolute;
    top: 6px; right: 6px;
    width: 28px; height: 28px;
    background: var(--green);
    color: white;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-weight: 700;
  }
  .choice.wrong{
    border-color: var(--red);
    animation: shake 0.4s ease;
  }
  .choice.wrong::after{
    content: "✕";
    position: absolute;
    top: 6px; right: 6px;
    width: 28px; height: 28px;
    background: var(--red);
    color: white;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    font-weight: 700;
  }
  .choice.disabled{ cursor: default; }
  @keyframes shake{
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }

  .feedback{
    min-height: 1.6em;
    font-weight: 700;
    font-size: 1.05rem;
    color: var(--plum-dark);
    text-align:center;
  }

  .controls{
    display:flex;
    justify-content:center;
    margin-top: 14px;
    gap: 12px;
  }
  button.action{
    background: var(--coral);
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 0 #C6532F;
    font-family: inherit;
  }
  button.action:active{ transform: translateY(2px); box-shadow: 0 1px 0 #C6532F; }
  button.action:disabled{
    opacity: 0.4;
    cursor: default;
    box-shadow: none;
  }

  .banner{
    text-align:center;
    margin-top: 10px;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--plum-dark);
    min-height: 1.4em;
  }

  .no-audio-note{
    text-align:center;
    font-size: 0.85rem;
    color: var(--plum-dark);
    opacity: 0.6;
    margin-top: 18px;
  }
</style>
</head>

const feelings = [
  { word: "sick", img: img_sick, audio: audio_sick },
  { word: "bored", img: img_bored, audio: audio_bored },
  { word: "scared", img: img_scared, audio: audio_scared },
  { word: "tired", img: img_tired, audio: audio_tired },
  { word: "excited", img: img_excited, audio: audio_excited },
  { word: "happy", img: img_happy, audio: audio_happy }
];

function shuffle(arr){
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let roundOrder = [];
let roundIndex = 0;
let score = 0;
let currentChoices = [];
let currentTarget = null;
let answered = false;

const speakerBtn = document.getElementById('speakerBtn');
const choicesEl = document.getElementById('choices');
const feedbackEl = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const restartBtn = document.getElementById('restartBtn');
const bannerEl = document.getElementById('banner');
const roundNumEl = document.getElementById('roundNum');
const scoreEl = document.getElementById('score');

const player = new Audio();
player.addEventListener('play', () => speakerBtn.classList.add('playing'));
player.addEventListener('ended', () => speakerBtn.classList.remove('playing'));
player.addEventListener('pause', () => speakerBtn.classList.remove('playing'));

function speak(item){
  player.pause();
  player.currentTime = 0;
  player.src = item.audio;
  player.play().catch(() => {});
}

function setupRound(){
  answered = false;
  feedbackEl.textContent = '';
  nextBtn.disabled = true;

  currentTarget = roundOrder[roundIndex];
  const distractors = shuffle(feelings.filter(f => f.word !== currentTarget.word)).slice(0, 2);
  currentChoices = shuffle([currentTarget, ...distractors]);

  roundNumEl.textContent = (roundIndex + 1) + ' / ' + feelings.length;

  choicesEl.innerHTML = '';
  currentChoices.forEach(item => {
    const el = document.createElement('div');
    el.className = 'choice';
    el.innerHTML = `<img src="${item.img}" alt="">`;
    el.addEventListener('click', () => onChoiceClick(item, el));
    choicesEl.appendChild(el);
  });

  setTimeout(() => speak(currentTarget), 300);
}

function onChoiceClick(item, el){
  if (answered) return;
  answered = true;

  const allChoiceEls = choicesEl.querySelectorAll('.choice');
  allChoiceEls.forEach(c => c.classList.add('disabled'));

  if (item.word === currentTarget.word){
    el.classList.add('correct');
    score++;
    scoreEl.textContent = score;
    feedbackEl.textContent = 'Yes! That\'s "' + currentTarget.word + '".';
    feedbackEl.style.color = 'var(--green)';
  } else {
    el.classList.add('wrong');
    allChoiceEls.forEach(c => {
      if (c.querySelector('img').src === currentTarget.img){
        c.classList.add('correct');
      }
    });
    feedbackEl.textContent = 'Not quite — that was "' + currentTarget.word + '".';
    feedbackEl.style.color = 'var(--red)';
  }

  nextBtn.disabled = false;
}

function nextRound(){
  roundIndex++;
  if (roundIndex >= roundOrder.length){
    endGame();
  } else {
    setupRound();
  }
}

function endGame(){
  choicesEl.innerHTML = '';
  feedbackEl.textContent = '';
  nextBtn.style.display = 'none';
  restartBtn.style.display = 'inline-block';
  bannerEl.textContent = '🎉 Finished! You scored ' + score + ' out of ' + feelings.length + '.';
}

function startGame(){
  roundOrder = shuffle(feelings);
  roundIndex = 0;
  score = 0;
  scoreEl.textContent = 0;
  bannerEl.textContent = '';
  nextBtn.style.display = 'inline-block';
  nextBtn.disabled = true;
  restartBtn.style.display = 'none';
  setupRound();
}

speakerBtn.addEventListener('click', () => {
  if (currentTarget) speak(currentTarget);
});
nextBtn.addEventListener('click', nextRound);
restartBtn.addEventListener('click', startGame);

startGame();
</script>
